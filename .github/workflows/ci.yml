name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Format check (Prettier)
        run: npm run format

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      # Build runs before typecheck deliberately: Next.js generates types like LayoutProps into
      # .next/types/ only during build. Running typecheck first fails on a fresh checkout since
      # that file doesn't exist yet — see https://github.com/vercel/next.js/issues/53973
      - name: Build (Next.js static export)
        run: npm run build

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
